services:
  # ------------------------------------------------------------------
  # Main NMA server — runs network meta-analysis
  # Endpoint: https://biostatistics.med.auth.gr/mcp/netmeta
  # ------------------------------------------------------------------
  netmeta-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: netmeta-mcp:latest
    container_name: netmeta-mcp
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - R_HOME=/usr/lib/R
      - PYTHONUNBUFFERED=1
      # ROOT_PATH is empty — nginx rewrites /mcp/netmeta → /mcp internally
      - ROOT_PATH=
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/mcp"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # ------------------------------------------------------------------
  # Verify server — verifies NMA results and generates R code
  # Endpoint: https://biostatistics.med.auth.gr/mcp/verify
  # ------------------------------------------------------------------
  verify-mcp:
    build:
      context: .
      dockerfile: Dockerfile.verify
    image: verify-mcp:latest
    container_name: verify-mcp
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      # Verifier R scripts from mcp-verifier, rsynced alongside this repo
      - ${VERIFIER_SRC:-../verifier}:/opt/verifier:ro
    environment:
      - R_HOME=/usr/lib/R
      - PYTHONUNBUFFERED=1
      # ROOT_PATH is empty — nginx rewrites /mcp/verify → /mcp internally
      - ROOT_PATH=
      - PORT=8001
      - VERIFIERS_DIR=/opt/verifier
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/mcp"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
