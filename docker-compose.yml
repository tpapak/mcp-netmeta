services:
  # ------------------------------------------------------------------
  # Main NMA server — runs network meta-analysis
  # Endpoint: https://biostatistics.med.auth.gr/mcp/netmeta/mcp
  # ------------------------------------------------------------------
  netmeta-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: netmeta-mcp:latest
    container_name: netmeta-mcp
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - R_HOME=/usr/lib/R
      - PYTHONUNBUFFERED=1
      - ROOT_PATH=/mcp/netmeta
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/mcp"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # ------------------------------------------------------------------
  # Verify server — verifies NMA results and generates R code
  # Endpoint: https://biostatistics.med.auth.gr/mcp/netmeta-verify/mcp
  # ------------------------------------------------------------------
  netmeta-verify-mcp:
    build:
      context: .
      dockerfile: Dockerfile.verify
    image: netmeta-verify-mcp:latest
    container_name: netmeta-verify-mcp
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      - R_HOME=/usr/lib/R
      - PYTHONUNBUFFERED=1
      - ROOT_PATH=/mcp/netmeta-verify
      - PORT=8001
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/mcp"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
