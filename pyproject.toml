[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "netmeta-mcp"
version = "0.1.0"
description = "MCP server for network meta-analysis using the R netmeta package"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
authors = [
    { name = "Thodoris Papakonstantinou" },
    { name = "Guido Schwarzer" },
]
keywords = ["mcp", "network-meta-analysis", "netmeta", "evidence-synthesis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]
http = [
    "uvicorn>=0.24.0",
    "starlette>=0.32.0",
]

[project.scripts]
netmeta-mcp        = "netmeta_mcp.server:main"
netmeta-verify-mcp = "netmeta_verify.server:main"

[project.urls]
Homepage = "https://github.com/tpapak/mcp-netmeta"
Documentation = "https://biostatistics.med.auth.gr/mcp/netmeta"
Repository = "https://github.com/tpapak/mcp-netmeta"

[tool.hatch.build.targets.wheel]
packages = ["src/netmeta_mcp", "src/netmeta_verify"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
