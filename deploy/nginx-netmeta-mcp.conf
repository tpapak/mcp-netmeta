# Nginx reverse proxy config for netmeta-mcp and netmeta-verify-mcp
# Add this to the server block for biostatistics.med.auth.gr
#
# Endpoints:
#   https://biostatistics.med.auth.gr/mcp/netmeta/mcp         (NMA server)
#   https://biostatistics.med.auth.gr/mcp/netmeta-verify/mcp  (Verify server)
#
# Include this file in your nginx server block:
#   include /etc/nginx/conf.d/netmeta-mcp.conf;
# Or copy the location blocks into your existing server config.

# ------------------------------------------------------------------
# NMA server (port 8000)
# ------------------------------------------------------------------
location /mcp/netmeta/ {
    proxy_pass http://127.0.0.1:8000/;
    proxy_http_version 1.1;

    # Required for SSE (Server-Sent Events) used by MCP Streamable HTTP
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding on;

    # Standard proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # MCP session header
    proxy_pass_header Mcp-Session-Id;

    # Timeout settings for long-running analyses
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 10s;
}

# ------------------------------------------------------------------
# Verify server (port 8001)
# ------------------------------------------------------------------
location /mcp/netmeta-verify/ {
    proxy_pass http://127.0.0.1:8001/;
    proxy_http_version 1.1;

    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding on;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_pass_header Mcp-Session-Id;

    # Verification can be CPU-intensive — allow extra time
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 10s;
}
