# Nginx config for mcp/ web pages + MCP service reverse proxies
# Add to the server block for biostatistics.med.auth.gr:
#   include /etc/nginx/conf.d/netmeta-mcp.conf;
#
# URLs:
#   https://biostatistics.med.auth.gr/mcp/                  (landing page)
#   https://biostatistics.med.auth.gr/mcp/netmeta/          (netmeta docs)
#   https://biostatistics.med.auth.gr/mcp/netmeta           (NMA MCP endpoint)
#   https://biostatistics.med.auth.gr/mcp/netmeta-verify    (Verify MCP endpoint)
#   https://biostatistics.med.auth.gr/mcp/verifier/         (verifier docs)
#
# The MCP containers serve at http://127.0.0.1:800x/mcp internally.
# Nginx strips the public prefix and rewrites to /mcp so the container
# never needs to know about the public path.

# ------------------------------------------------------------------
# Static web pages (rsynced to /var/www/mcp)
# Serves /mcp/, /mcp/verifier/ etc.
# ------------------------------------------------------------------
location /mcp/ {
    alias /var/www/mcp/;
    index index.html;
    try_files $uri $uri/ $uri.html =404;

    location ~* \.(js|css|png|jpg|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}

# ------------------------------------------------------------------
# /mcp/netmeta/  →  GitHub README (permanent redirect)
# ------------------------------------------------------------------
location = /mcp/netmeta/ {
    return 301 https://github.com/tpapak/mcp-netmeta/blob/paper/README.md;
}

location = /mcp/netmeta/docs {
    return 301 https://github.com/tpapak/mcp-netmeta/blob/paper/docs/USAGE.md;
}

# ------------------------------------------------------------------
# NMA MCP server  →  https://…/mcp/netmeta
# Container: http://127.0.0.1:8000/mcp
# Rewrite: /mcp/netmeta  →  /mcp   (exact endpoint the container exposes)
# ------------------------------------------------------------------
location = /mcp/netmeta {
    proxy_pass http://127.0.0.1:8000/mcp;
    proxy_http_version 1.1;

    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding on;

    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_pass_header Mcp-Session-Id;

    proxy_read_timeout    300s;
    proxy_send_timeout    300s;
    proxy_connect_timeout  10s;
}

# DELETE /mcp/netmeta/<session-id>  — MCP session teardown
location ~ ^/mcp/netmeta/([^/]+)$ {
    proxy_pass http://127.0.0.1:8000/mcp/$1;
    proxy_http_version 1.1;

    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding on;

    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_pass_header Mcp-Session-Id;

    proxy_read_timeout    300s;
    proxy_send_timeout    300s;
    proxy_connect_timeout  10s;
}

# ------------------------------------------------------------------
# Verify MCP server  →  https://…/mcp/netmeta-verify
# Container: http://127.0.0.1:8001/mcp
# ------------------------------------------------------------------
location = /mcp/netmeta-verify {
    proxy_pass http://127.0.0.1:8001/mcp;
    proxy_http_version 1.1;

    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding on;

    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_pass_header Mcp-Session-Id;

    proxy_read_timeout    300s;
    proxy_send_timeout    300s;
    proxy_connect_timeout  10s;
}

location ~ ^/mcp/netmeta-verify/([^/]+)$ {
    proxy_pass http://127.0.0.1:8001/mcp/$1;
    proxy_http_version 1.1;

    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding on;

    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_pass_header Mcp-Session-Id;

    proxy_read_timeout    300s;
    proxy_send_timeout    300s;
    proxy_connect_timeout  10s;
}
