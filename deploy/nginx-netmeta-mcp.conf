# Nginx config for mcp/ web pages + MCP service reverse proxies
# Add to the server block for biostatistics.med.auth.gr:
#   include /etc/nginx/conf.d/netmeta-mcp.conf;
#
# URLs:
#   https://biostatistics.med.auth.gr/mcp/                    (landing page)
#   https://biostatistics.med.auth.gr/mcp/netmeta/            (netmeta docs)
#   https://biostatistics.med.auth.gr/mcp/verifier/           (verifier docs)
#   https://biostatistics.med.auth.gr/mcp/netmeta/mcp         (NMA MCP server)
#   https://biostatistics.med.auth.gr/mcp/netmeta-verify/mcp  (Verify MCP server)

# ------------------------------------------------------------------
# Static web pages (rsynced to /var/www/mcp)
# ------------------------------------------------------------------
location /mcp/ {
    alias /var/www/mcp/;
    index index.html;
    try_files $uri $uri/ $uri.html =404;

    # Cache static assets
    location ~* \.(js|css|png|jpg|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}

# ------------------------------------------------------------------
# NMA server (port 8000)
# ------------------------------------------------------------------
location /mcp/netmeta/ {
    proxy_pass http://127.0.0.1:8000/;
    proxy_http_version 1.1;

    # Required for SSE (Server-Sent Events) used by MCP Streamable HTTP
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding on;

    # Standard proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # MCP session header
    proxy_pass_header Mcp-Session-Id;

    # Timeout settings for long-running analyses
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 10s;
}

# ------------------------------------------------------------------
# Verify server (port 8001)
# ------------------------------------------------------------------
location /mcp/netmeta-verify/ {
    proxy_pass http://127.0.0.1:8001/;
    proxy_http_version 1.1;

    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding on;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_pass_header Mcp-Session-Id;

    # Verification can be CPU-intensive — allow extra time
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 10s;
}
